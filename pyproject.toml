[project]
name = "paybound-services"
version = "0.1.0"
description = "Paybound Python AI layer: agentic pipeline, ML services, and the audit-narrative explainer."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]  # line length handled by formatter; B905 (zip strict=) too noisy for scripts

[tool.pytest.ini_options]
testpaths = ["services", "workflows"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"

[tool.setuptools]
packages = ["services"]
