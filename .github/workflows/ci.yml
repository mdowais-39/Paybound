name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Build/clippy use the committed .sqlx offline cache — no DB needed to compile.
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: paybound
          POSTGRES_PASSWORD: paybound
          POSTGRES_DB: paybound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paybound"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integration tests (#[sqlx::test]) connect here at runtime to spin up
      # per-test databases.
      DATABASE_URL: postgres://paybound:paybound@localhost:5432/paybound
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Refresh template collation (pgvector image quirk; no-op if matched)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=paybound psql -h localhost -U paybound -d postgres \
            -c "ALTER DATABASE template1 REFRESH COLLATION VERSION;" || true
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  python:
    name: Python — ruff, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          # Light deps needed for imports/collection; the heavy ML/workflow tests
          # skip when their artifacts/servers are absent (see the test guards).
          pip install ruff pytest requests "psycopg[binary]" joblib numpy temporalio
      - name: ruff
        run: ruff check services workflows
      - name: pytest
        run: pytest services workflows

  frontend:
    name: Frontend — tsc, vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run lint
      - name: test
        run: npm test
