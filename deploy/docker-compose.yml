# Paybound local stack — one command brings up infra for the whole build.
#   docker compose -f deploy/docker-compose.yml up -d
#
# Core services (always): Postgres, Redis, OTel Collector, Tempo, Grafana.
# Temporal (Phase 8) is behind the `workflow` profile to keep Phase 0 light:
#   docker compose -f deploy/docker-compose.yml --profile workflow up -d
name: paybound

services:
  postgres:
    # pgvector image = Postgres 16 + the `vector` extension, needed for catalog
    # search embeddings from Phase 3. Set up now to avoid a later migration.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: paybound
      POSTGRES_PASSWORD: paybound
      POSTGRES_DB: paybound
    ports:
      # Host 5433 to avoid a clash with a locally-installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paybound"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"   # tempo query

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo

  # --- Phase 8 durable workflow (opt-in: --profile workflow) ---
  temporal:
    image: temporalio/auto-setup:1.25.2
    profiles: ["workflow"]
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=paybound
      - POSTGRES_PWD=paybound
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: ["workflow"]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

volumes:
  pgdata:
  tempodata:
